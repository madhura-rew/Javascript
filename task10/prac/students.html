<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Load JSON using Fetch</title>

	<style>
		* { box-sizing: border-box; }

		body {
			font-family: "Segoe UI", system-ui, Arial, sans-serif;
			background: #f4f6fb;
			color: #1f2937;
			margin: 0;
			padding: 40px 20px;
			display: flex;
			flex-direction: column;
			align-items: center;
		}

		h2 { margin-bottom: 20px; font-weight: 600; }

		button {
			background: #2563eb;
			color: #fff;
			border: none;
			padding: 10px 22px;
			font-size: 15px;
			border-radius: 8px;
			cursor: pointer;
			transition: background 0.2s ease, transform 0.1s ease;
			margin-bottom: 24px;
		}

		button:hover { background: #1d4ed8; }
		button:active { transform: scale(0.97); }
		button:disabled { background: #9ca3af; cursor: not-allowed; }

		table {
			width: 100%;
			max-width: 640px;
			border-collapse: collapse;
			background: #fff;
			border-radius: 10px;
			overflow: hidden;
			box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
		}

		thead th {
			background: #1e293b;
			color: #f8fafc;
			text-align: left;
			padding: 12px 16px;
			font-size: 14px;
			letter-spacing: 0.4px;
		}

		tbody td {
			padding: 12px 16px;
			font-size: 14px;
			border-bottom: 1px solid #e5e7eb;
		}

		tbody tr:nth-child(even) { background: #f8fafc; }
		tbody tr:hover { background: #eff6ff; }

		.status {
			min-height: 22px;
			margin-bottom: 12px;
			font-size: 14px;
			color: #6b7280;
		}

		.status.error { color: #dc2626; }

		.form-container {
			background: #fff;
			padding: 20px;
			border-radius: 10px;
			box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
			margin-bottom: 24px;
			width: 100%;
			max-width: 640px;
		}

		.form-container h3 {
			margin-top: 0;
			margin-bottom: 16px;
			font-size: 16px;
			font-weight: 600;
		}

		.form-row {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
			gap: 12px;
			margin-bottom: 12px;
		}

		label {
			display: block;
			font-size: 13px;
			font-weight: 500;
			margin-bottom: 4px;
			color: #374151;
		}

		input {
			width: 100%;
			padding: 8px 12px;
			border: 1px solid #d1d5db;
			border-radius: 6px;
			font-size: 14px;
		}

		input:focus {
			outline: none;
			border-color: #2563eb;
			box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
		}

		.btn-add {
			background: #10b981;
			width: 100%;
			margin-bottom: 12px;
		}

		.btn-add:hover { background: #059669; }

		.btn-reset {
			background: #ef4444;
			width: 100%;
			margin-bottom: 0;
			padding: 8px 22px;
			font-size: 13px;
		}

		.btn-reset:hover { background: #dc2626; }
	</style>
</head>

<body>
	<h2>Student Details using Fetch()</h2>

	<button id="loadBtn" onclick="loadStudents()">Load Students</button>

	<p id="status" class="status"></p>

	<div class="form-container">
		<h3>Add New Student</h3>
		<div class="form-row">
			<div>
				<label for="idInput">ID</label>
				<input type="number" id="idInput" placeholder="e.g. 4" required />
			</div>
			<div>
				<label for="nameInput">Name</label>
				<input type="text" id="nameInput" placeholder="Full name" required />
			</div>
			<div>
				<label for="deptInput">Department</label>
				<input type="text" id="deptInput" placeholder="e.g. CSE" required />
			</div>
			<div>
				<label for="marksInput">Marks</label>
				<input type="number" id="marksInput" placeholder="0-100" min="0" max="100" required />
			</div>
		</div>
		<button class="btn-add" onclick="addStudent()">Add Student</button>
		<button class="btn-reset" onclick="resetToJSON()">Reset to original students.json</button>
	</div>

	<table id="studentTable">
		<thead>
			<tr>
				<th>ID</th>
				<th>Name</th>
				<th>Department</th>
				<th>Marks</th>
			</tr>
		</thead>
		<tbody></tbody>
	</table>

	<script>
		const STORAGE_KEY = "students";
		let students = [];

		function render() {
			const tableBody = document.querySelector("#studentTable tbody");
			tableBody.innerHTML = "";

			students.forEach(student => {
				tableBody.innerHTML += `
					<tr>
						<td>${student.id}</td>
						<td>${student.name}</td>
						<td>${student.department}</td>
						<td>${student.marks}</td>
					</tr>`;
			});
		}

		function save() {
			localStorage.setItem(STORAGE_KEY, JSON.stringify(students));
		}

		function setStatus(message, isError = false) {
			const status = document.getElementById("status");
			status.textContent = message;
			status.classList.toggle("error", isError);
		}

		async function loadStudents() {
			const btn = document.getElementById("loadBtn");
			btn.disabled = true;
			setStatus("Loading...");

			try {
				const saved = localStorage.getItem(STORAGE_KEY);

				if (saved) {
					students = JSON.parse(saved);
					setStatus(`Loaded ${students.length} student(s) from local storage.`);
				} else {
					const response = await fetch("students.json");

					if (!response.ok) {
						throw new Error(`HTTP error! Status: ${response.status}`);
					}

					students = await response.json();
					save();
					setStatus(`Fetched ${students.length} student(s) from students.json.`);
				}

				render();
			} catch (error) {
				console.log("Error:", error);
				setStatus("Failed to load data: " + error.message, true);
			} finally {
				btn.disabled = false;
			}
		}

		function addStudent() {
			const idInput = document.getElementById("idInput");
			const nameInput = document.getElementById("nameInput");
			const deptInput = document.getElementById("deptInput");
			const marksInput = document.getElementById("marksInput");

			const id = parseInt(idInput.value, 10);
			const name = nameInput.value.trim();
			const department = deptInput.value.trim();
			const marks = parseFloat(marksInput.value);

			if (isNaN(id) || !name || !department || isNaN(marks)) {
				setStatus("Please fill all fields correctly.", true);
				return;
			}

			if (marks < 0 || marks > 100) {
				setStatus("Marks must be between 0 and 100.", true);
				return;
			}

			if (students.some(s => s.id === id)) {
				setStatus(`Student with ID ${id} already exists.`, true);
				return;
			}

			students.push({ id, name, department, marks });
			save();
			render();

			[idInput, nameInput, deptInput, marksInput].forEach(input => input.value = "");
			idInput.focus();

			setStatus(`Added ${name}. Total: ${students.length} student(s).`);
		}

		function resetToJSON() {
			if (!confirm("Clear saved data and reload from students.json?")) return;

			localStorage.removeItem(STORAGE_KEY);
			students = [];
			document.querySelector("#studentTable tbody").innerHTML = "";
			loadStudents();
		}

		window.addEventListener("DOMContentLoaded", loadStudents);
	</script>
</body>
</html>
