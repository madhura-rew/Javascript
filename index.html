<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIT Nagpur - Department of Computer Science</title>

    <!-- 3. EXTERNAL JAVASCRIPT LINK -->
    <!-- In a real project, you would save this as 'script.js' in the same folder -->
    <script src="script.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 { color: #d32f2f; }
        .nav-link {
            display: inline-block;
            margin-top: 10px;
            color: #0056b3;
            text-decoration: none;
            font-weight: bold;
        }
        .nav-link:hover { text-decoration: underline; }
        
        input, button {
            padding: 8px;
            margin: 5px 0;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background-color: #d32f2f;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover { background-color: #b71c1c; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th { background-color: #f2f2f2; }
    </style>

    <!-- 2. INTERNAL JAVASCRIPT -->
    <script>
        function addStudent() {
            // Get input values
            const name = document.getElementById('name').value;
            const roll = document.getElementById('roll').value;
            const course = document.getElementById('course').value;

            // Simple validation
            if(name === "" || roll === "") {
                alert("Please fill in all fields!");
                return;
            }

            // Create a new table row
            const table = document.getElementById('studentTable').getElementsByTagName('tbody')[0];
            const newRow = table.insertRow();

            // Insert cells
            const cell1 = newRow.insertCell(0);
            const cell2 = newRow.insertCell(1);
            const cell3 = newRow.insertCell(2);

            cell1.innerHTML = name;
            cell2.innerHTML = roll;
            cell3.innerHTML = course;

            // Clear inputs
            document.getElementById('name').value = "";
            document.getElementById('roll').value = "";
            document.getElementById('course').value = "";
        }
    </script>
</head>
<body>

    <div class="container">
        <h1>Department of Computer Science</h1>
        <p><strong>SIT Nagpur</strong> - Symbiosis Institute of Technology</p>
        
        <!-- Link to Student Information Page -->
        <a href="student_info.html" class="nav-link">Go to Student Information Page &rarr;</a>

        <hr>

        <h3>Student Registration</h3>
        
        <!-- 1. INLINE JAVASCRIPT -->
        <!-- The onclick attribute is inline JS -->
        <button onclick="alert('Welcome to SIT Nagpur!')">Click for Welcome Message</button>

        <div style="margin-top: 20px;">
            <input type="text" id="name" placeholder="Student Name">
            <input type="number" id="roll" placeholder="Roll Number">
            <input type="text" id="course" placeholder="Course (e.g., BCA, B.Tech)">
            <button onclick="addStudent()">Add Student</button>
        </div>

        <h3>Registered Students</h3>
        <table id="studentTable">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Roll No</th>
                    <th>Course</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will appear here -->
            </tbody>
        </table>
    </div>

</body>
</html>
